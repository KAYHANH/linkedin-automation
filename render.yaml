# ==============================================================================
# Render Blueprint Specification — FounderOS LinkedIn Studio
# Unified Docker Architecture:
#   1. Web Service: Multi-stage Docker container running React SPA + FastAPI
#   2. Cron Job: Identical container executing daily CLI run at 09:00 IST (03:30 UTC)
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. FounderOS LinkedIn Studio Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: founderos-linkedin-studio
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: PUBLISH_TIMEZONE
        value: Asia/Kolkata
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: AUTO_PUBLISH
        value: "false"
      - key: DRY_RUN
        value: "true"
      - key: GITHUB_STATE_BRANCH
        value: automation-state
      - key: LINKEDIN_API_VERSION
        value: "202501"
      - key: LINKEDIN_ENDPOINT_STYLE
        value: rest/posts
      - key: DASHBOARD_USERNAME
        value: founder
      # --- Sensitive Secrets (Configure in Render Dashboard Environment Settings) ---
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DASHBOARD_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        sync: false
      - key: LINKEDIN_ACCESS_TOKEN
        sync: false
      - key: LINKEDIN_AUTHOR_URN
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Daily Automation Cron Job (30 3 * * * UTC = 09:00 AM Asia/Kolkata)
  # ----------------------------------------------------------------------------
  - type: cron
    name: groq-linkedin-daily-publisher
    env: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m app.main --publish
    schedule: "30 3 * * *"
    plan: starter
    envVars:
      - key: PUBLISH_TIMEZONE
        value: Asia/Kolkata
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: AUTO_PUBLISH
        value: "false"
      - key: DRY_RUN
        value: "true"
      - key: GITHUB_STATE_BRANCH
        value: automation-state
      - key: LINKEDIN_API_VERSION
        value: "202501"
      - key: LINKEDIN_ENDPOINT_STYLE
        value: rest/posts
      # --- Sensitive Secrets (Configure in Render Dashboard Environment Settings) ---
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        sync: false
      - key: LINKEDIN_ACCESS_TOKEN
        sync: false
      - key: LINKEDIN_AUTHOR_URN
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
