# ==============================================================================
# Render Blueprint Specification — FounderOS LinkedIn Studio
# Services:
#   1. Web Service: FastAPI application serving compiled React UI & REST API
#   2. Cron Job: Daily automated content generation & publication (09:00 IST)
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. FounderOS LinkedIn Studio Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: founderos-linkedin-studio
    runtime: python
    buildCommand: cd frontend && npm install && npm run build && cd .. && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.api:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PUBLISH_TIMEZONE
        value: Asia/Kolkata
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: AUTO_PUBLISH
        value: "false"
      - key: DRY_RUN
        value: "true"
      - key: GITHUB_STATE_BRANCH
        value: automation-state
      - key: LINKEDIN_API_VERSION
        value: "202501"
      - key: LINKEDIN_ENDPOINT_STYLE
        value: rest/posts
      - key: DASHBOARD_USERNAME
        value: founder
      # --- Sensitive Secrets (Enter in Render Dashboard) ---
      - key: DASHBOARD_PASSWORD_HASH
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        sync: false
      - key: LINKEDIN_ACCESS_TOKEN
        sync: false
      - key: LINKEDIN_AUTHOR_URN
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Daily Cron Job (30 3 * * * UTC = 09:00 AM Asia/Kolkata)
  # ----------------------------------------------------------------------------
  - type: cron
    name: groq-linkedin-daily-publisher
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m app.main --publish
    schedule: "30 3 * * *"
    plan: starter
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PUBLISH_TIMEZONE
        value: Asia/Kolkata
      - key: GROQ_MODEL
        value: qwen/qwen3.8-27b
      - key: AUTO_PUBLISH
        value: "false"
      - key: DRY_RUN
        value: "true"
      - key: GITHUB_STATE_BRANCH
        value: automation-state
      - key: LINKEDIN_API_VERSION
        value: "202501"
      - key: LINKEDIN_ENDPOINT_STYLE
        value: rest/posts
      # --- Sensitive Secrets ---
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPOSITORY
        sync: false
      - key: LINKEDIN_ACCESS_TOKEN
        sync: false
      - key: LINKEDIN_AUTHOR_URN
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
