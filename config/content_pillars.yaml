# ==============================================================================
# Content Pillars and 30-Day Rotation Schedule
# Balances 8 core themes across a monthly cadence.
# Upstream Reference: linkedin-content-planner & founder-topics
# ==============================================================================

pillars:
  - id: tech_trends
    name: "Technology Industry & Software Trends"
    category: "Authority"
    description: "Deep dive into architectural shifts, cloud infrastructure evolution, legacy modernization, and engineering best practices."
    preferred_formulas: ["F10", "F7", "F18", "F20"]
    preferred_angles: ["A1", "A10"]
    primary_goal: "saves"
    sample_topics:
      - "Why architectural simplicity often beats microservice sprawl in mid-stage systems"
      - "The real cost of cloud vendor lock-in versus developer velocity"
      - "Evaluating database consistency models when scaling read-heavy workloads"
      - "Why type safety and schema validation are the best documentation you can write"

  - id: ai_agents_automation
    name: "AI Models, Tools, Agents & Business Automation"
    category: "Authority"
    description: "Pragmatic application of LLMs, agentic patterns, deterministic tooling, and operational automation without speculative hype."
    preferred_formulas: ["F1", "F17", "F5", "F10"]
    preferred_angles: ["A6", "A9"]
    primary_goal: "comments"
    sample_topics:
      - "Why agent loops require strict circuit breakers and deterministic boundaries"
      - "Separating LLM reasoning from code execution in production workflows"
      - "Evaluating small, specialized open models against monolithic frontier APIs"
      - "The difference between toy AI demos and production-grade reliability"

  - id: startup_saas_strategy
    name: "Startup Building, Product Strategy & SaaS"
    category: "Narrative"
    description: "Hard-won lessons in bootstrapping, validating customer problems, pricing mechanisms, and SaaS product engineering."
    preferred_formulas: ["F7", "F3", "F4", "F18"]
    preferred_angles: ["A1", "A4", "A5"]
    primary_goal: "reposts"
    sample_topics:
      - "The trap of building features for power users before solving the onboarding friction"
      - "Why pricing reflects your product's category label more than its underlying code"
      - "Deciding what NOT to build: the discipline of ruthless MVP scope control"
      - "Managing technical debt when early runway requires shipping today"

  - id: kodetocareer_education
    name: "KodeToCareer & Skills-First Engineering Careers"
    category: "Mission / Perspective"
    description: "Challenges in developer education, why practical ability beats degree pedigree, and mentorship insights."
    preferred_formulas: ["F8", "F15", "F12", "F3"]
    preferred_angles: ["A7", "A2"]
    primary_goal: "comments"
    sample_topics:
      - "Why college coding curriculums often fail to prepare candidates for git, CI/CD, and real codebases"
      - "How junior developers can showcase genuine problem-solving without 5 years of resume keywords"
      - "The importance of code review etiquette: learning to give and receive constructive technical critique"
      - "Why hands-on debugging skills correlate higher with job success than algorithmic memorization"

  - id: viato_travel_tech
    name: "Viato & Travel Agency Workflow Automation"
    category: "Domain Deep-Dive"
    description: "Unpacking the operational friction of boutique travel operators, itinerary logistics, and vertical SaaS opportunities."
    preferred_formulas: ["F2", "F13", "F17", "F7"]
    preferred_angles: ["A1", "A5"]
    primary_goal: "saves"
    sample_topics:
      - "Why independent travel agencies still drown in disconnected WhatsApp chats and spreadsheets"
      - "Designing software for non-technical domain operators: UX simplicity is the core feature"
      - "The hidden complexity of multi-vendor itinerary coordination and real-time adjustments"
      - "Why vertical SaaS succeeds by replacing manual coordination rather than inventing new behaviors"

  - id: hiring_future_of_work
    name: "Recruitment, Hiring Workflows & The Future of Work"
    category: "Authority"
    description: "Analyzing modern technical hiring, resume screening inefficiencies, work-sample tests, and high-trust engineering teams."
    preferred_formulas: ["F10", "F19", "F18", "F4"]
    preferred_angles: ["A8", "A9"]
    primary_goal: "comments"
    sample_topics:
      - "Why leetcode interviews test puzzle memorization rather than actual software engineering ability"
      - "How to conduct an asynchronous take-home project evaluation that respects candidate time"
      - "The breakdown of automated ATS keyword filters and the rise of verified skill portfolios"
      - "What senior engineers actually look for when evaluating an engineering culture"

  - id: responsible_ai_security
    name: "Responsible AI, Privacy, Security & Human Judgment"
    category: "Governance"
    description: "Data privacy in LLM systems, secure credential hygiene, guardrails, and why human oversight remains indispensable."
    preferred_formulas: ["F10", "F1", "F18", "F20"]
    preferred_angles: ["A6", "A10"]
    primary_goal: "reposts"
    sample_topics:
      - "Prompt injection and data exfiltration: treating LLM inputs like untrusted user SQL queries"
      - "Why autonomous AI agents still require human-in-the-loop validation for irreversible actions"
      - "Handling privacy regulations and data retention when integrating third-party AI APIs"
      - "The illusion of perfect AI confidence: building systems that know when to fail gracefully"

  - id: developer_productivity
    name: "Practical Productivity & Software Craftsmanship"
    category: "Narrative / Practical"
    description: "Personal engineering habits, terminal tooling, automated testing discipline, and deep work strategies."
    preferred_formulas: ["F16", "F11", "F5", "F7"]
    preferred_angles: ["A3", "A7"]
    primary_goal: "likes"
    sample_topics:
      - "Why unit test coverage is a developer velocity tool, not just a management compliance metric"
      - "The cognitive cost of context switching: why batching code reviews protects flow state"
      - "Simple command-line utilities and shell scripting that save hours every single week"
      - "The habit of writing clean technical notes and design docs before touching keyboard to code"

